[package]
name = "rymessage"
version = "0.2.7"
description = "RyMessage desktop client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rymessage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["default-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "~2.11.6", features = ["tray-icon"] }
tauri-plugin-autostart = "~2.5.1"
tauri-plugin-clipboard-manager = "~2.3.3"
tauri-plugin-opener = "~2.5.0"
tokio = { version = "1", default-features = false, features = ["net", "sync"] }
url = "~2.5.8"
